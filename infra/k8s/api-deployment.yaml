apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: media-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      volumes:
      - name: media-data
        emptyDir: {}
      containers:
      - name: api
        image: 360411403498.dkr.ecr.ap-southeast-2.amazonaws.com/media-tool-api:latest
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: media-data
          mountPath: /data/media
        envFrom:
        - configMapRef:
            name: media-tool-config
        - secretRef:
            name: media-tool-secrets
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: media-tool-aws-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: media-tool-aws-creds
              key: AWS_SECRET_ACCESS_KEY
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: media-tool
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000