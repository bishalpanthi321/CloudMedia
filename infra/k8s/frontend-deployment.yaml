apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: media-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 360411403498.dkr.ecr.ap-southeast-2.amazonaws.com/media-tool-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: API_INTERNAL_BASE_URL
          value: "http://api.media-tool.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: media-tool
spec:
  selector:
    app: frontend
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000