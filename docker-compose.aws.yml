services:
  redis:
    image: redis:7-alpine
    container_name: media-tool-redis
    ports:
      - "33004:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - media_net

  api:
    build:
      context: ./backend
    container_name: media-tool-api
    env_file:
      - .env.aws
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "33002:8000"
    volumes:
      - ./local_storage:/data/media
    networks:
      - media_net

  worker:
    build:
      context: ./backend
    container_name: media-tool-worker
    command: ["python", "-m", "app.worker.runner"]
    env_file:
      - .env.aws
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./local_storage:/data/media
    networks:
      - media_net

  frontend:
    build:
      context: ./web
    container_name: media-tool-frontend
    env_file:
      - .env.aws
    depends_on:
      - api
    ports:
      - "33001:3000"
    networks:
      - media_net

networks:
  media_net:
    driver: bridge
